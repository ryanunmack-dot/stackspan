<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Easing into new shoes week by week</title><desc id="desc">Four ascending steps along a weekly timeline showing time in new shoes rising gradually: short indoor, short walks, longer walks, most of the day, with a note to keep a backup pair.</desc>
  <style>
  .bg{fill:#fff}
  .ink{fill:none;stroke:#0f172a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .solid{fill:#0f172a}
  .muted{fill:#f8fafc;stroke:#0f172a;stroke-width:3;stroke-linejoin:round}
  .accent{fill:#ea580c;stroke:#ea580c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .label{font-family:Arial,Helvetica,sans-serif;font-size:38px;font-weight:600;letter-spacing:.02em;fill:#0f172a}
  .small{font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:600;letter-spacing:.01em;fill:#0f172a}
</style>
<rect class="bg" x="0" y="0" width="1080" height="360"/>
<path d="M76 230V180H302V230" class="muted" style="fill:#f1f5f9"/>
<text class="label" x="189" y="272" text-anchor="middle">week 1</text>
<text class="small" x="189" y="314" text-anchor="middle">short indoor</text>
<path d="M326 230V140H552V230" class="muted" style="fill:#f1f5f9"/>
<text class="label" x="439" y="272" text-anchor="middle">week 2</text>
<text class="small" x="439" y="314" text-anchor="middle">short walks</text>
<path d="M576 230V100H802V230" class="muted" style="fill:#f1f5f9"/>
<text class="label" x="689" y="272" text-anchor="middle">week 3</text>
<text class="small" x="689" y="314" text-anchor="middle">longer walks</text>
<path d="M826 230V60H1052V230" class="muted" style="fill:#f1f5f9"/>
<text class="label" x="939" y="272" text-anchor="middle">week 4+</text>
<text class="small" x="939" y="314" text-anchor="middle">most of the day</text>
<path d="M64 230V170H314V130H564V90H814V50H1064" class="accent" style="fill:none;stroke-width:4"/>
<path d="M50 230H1068" class="ink"/>
<path d="M50 230V44M42 56L50 44L58 56" class="ink"/>
<text class="small" transform="translate(34,137) rotate(-90)" text-anchor="middle">time in shoes</text>
<g transform="translate(78,62)">
  <path d="M0 40V14C0 8 6 4 12 7L28 16C40 21 56 24 66 29C73 32 76 37 76 42H0Z" class="muted"/>
  <path d="M0 42H76" class="ink"/>
  <text class="small" x="90" y="38">keep a backup pair</text>
</g>
</svg>
