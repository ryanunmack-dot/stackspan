<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Easing into new shoes week by week</title><desc id="desc">Four ascending steps along a weekly timeline showing time in new shoes rising gradually: short indoor, short walks, longer walks, most of the day, with a note to keep a backup pair.</desc>
  <style>
  .bg{fill:#fff}
  .ink{fill:none;stroke:#0f172a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .solid{fill:#0f172a}
  .muted{fill:#f8fafc;stroke:#0f172a;stroke-width:3;stroke-linejoin:round}
  .accent{fill:#ea580c;stroke:#ea580c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .label{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:600;letter-spacing:.02em;fill:#0f172a}
  .small{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:600;letter-spacing:.01em;fill:#0f172a}
</style>
<rect class="bg" x="0" y="0" width="1080" height="360"/>
<path d="M104 250V210H301V250" class="muted" style="fill:#f1f5f9"/>
<text class="label" x="202" y="286" text-anchor="middle">week 1</text>
<text class="small" x="202" y="318" text-anchor="middle">short indoor</text>
<path d="M329 250V165H526V250" class="muted" style="fill:#f1f5f9"/>
<text class="label" x="427" y="286" text-anchor="middle">week 2</text>
<text class="small" x="427" y="318" text-anchor="middle">short walks</text>
<path d="M554 250V115H751V250" class="muted" style="fill:#f1f5f9"/>
<text class="label" x="652" y="286" text-anchor="middle">week 3</text>
<text class="small" x="652" y="318" text-anchor="middle">longer walks</text>
<path d="M779 250V65H976V250" class="muted" style="fill:#f1f5f9"/>
<text class="label" x="877" y="286" text-anchor="middle">week 4+</text>
<text class="small" x="877" y="318" text-anchor="middle">most of the day</text>
<path d="M90 250V200H315V155H540V105H765V55H990" class="accent" style="fill:none;stroke-width:4"/>
<path d="M76 250H1004" class="ink"/>
<path d="M52 250V60M44 72L52 60L60 72" class="ink"/>
<text class="small" transform="translate(38,155) rotate(-90)" text-anchor="middle">time in shoes</text>
<g transform="translate(96,52)">
  <path d="M0 40V14C0 8 6 4 12 7L28 16C40 21 56 24 66 29C73 32 76 37 76 42H0Z" class="muted"/>
  <path d="M0 42H76" class="ink"/>
  <text class="small" x="92" y="36">keep a backup pair</text>
</g>
</svg>
